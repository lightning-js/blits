name: Comment Test Results

on:
  workflow_run:
    workflows: ["Run Blits Tests"]
    types: [completed]

jobs:
  comment-test-results:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write

    steps:
      - name: Download Test Results
        uses: actions/github-script@v9
        with:
          script: |
            const artifacts = await github.rest.actions.listWorkflowRunArtifacts({
              owner: context.repo.owner,
              repo: context.repo.repo,
              run_id: ${{ github.event.workflow_run.id }}
            });
            const art = artifacts.data.artifacts.find(a => a.name === "test-results");
            if (!art) {
              core.setFailed('No test-results artifact found');
              return;
            }
            const dl = await github.rest.actions.downloadArtifact({
              owner: context.repo.owner,
              repo: context.repo.repo,
              artifact_id: art.id,
              archive_format: 'zip'
            });
            require('fs').writeFileSync('test-results.zip', Buffer.from(dl.data));

      - name: Extract Test Results
        run: |

          mkdir -p extracted
          unzip -o test-results.zip -d extracted

          # Set environment variables from the extracted files
          echo "TIMESTAMP=$(cat extracted/timestamp.txt)" >> $GITHUB_ENV
          echo "SUMMARY=$(cat extracted/summary.txt)" >> $GITHUB_ENV
          echo "FAILED=$(cat extracted/failed.txt)" >> $GITHUB_ENV

          # Read PR information
          if [ -f extracted/pr_number.txt ]; then
            echo "PR_NUMBER=$(cat extracted/pr_number.txt)" >> $GITHUB_ENV
          else
            echo "PR_NUMBER=0" >> $GITHUB_ENV
          fi


          # Copy error file if it exists
          if [ -f extracted/error.txt ]; then
            cp extracted/error.txt raw_error.txt
          fi

          # Copy failing tests file if it exists
          if [ -f extracted/failing-tests.txt ]; then
            cp extracted/failing-tests.txt raw_failing_tests.txt
          fi

      - name: Post Test Results as PR Comment
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require('fs');

            try {
              // First check if PR number was passed from the test workflow
              let prNumber = parseInt(process.env.PR_NUMBER);

              // Fallback to the workflow_run PR data if available
              if (!prNumber || isNaN(prNumber) || prNumber === 0) {
                const pulls = context.payload.workflow_run.pull_requests;
                console.log(`Looking for PR information in workflow_run: Found ${pulls.length} PR(s).`);

                if (pulls.length === 0) {
                  console.warn('No pull request information found. Skipping comment.');
                  return;
                }

                prNumber = pulls[0].number;
              }

              console.log(`Posting comment to PR #${prNumber}`);

              const run = context.payload.workflow_run;
              const failed = process.env.FAILED === 'true' || run.conclusion !== 'success';
              const status = failed ? '❌ FAILED' : '✅ PASSED';
              const timestamp = new Date(process.env.TIMESTAMP);
              const runAt = Number.isNaN(timestamp.getTime())
                ? process.env.TIMESTAMP
                : timestamp.toISOString().replace('T', ' ').replace(/\.\d{3}Z$/, ' UTC');
              let commentBody = `#### Test Results: ${status}\n\n`
                              + `${process.env.SUMMARY}\n\n`
                              + `[View workflow run](${run.html_url}) · ${runAt}`;

              const details = (title, output) => {
                const limit = 12000;
                const text = output.length > limit
                  ? output.slice(0, limit) + '\n… Output truncated. See the workflow run for the full log.'
                  : output;
                const fence = '`'.repeat(Math.max(3, ...Array.from(text.matchAll(/`+/g), match => match[0].length + 1)));
                return `\n\n<details>\n<summary>${title}</summary>\n\n${fence}text\n${text}\n${fence}\n\n</details>`;
              };

              const failingTests = fs.existsSync('raw_failing_tests.txt')
                ? fs.readFileSync('raw_failing_tests.txt', 'utf8').trim()
                : '';
              if (failingTests) {
                commentBody += details('Failed assertions', failingTests);
              } else if (fs.existsSync('raw_error.txt')) {
                const errorOutput = fs.readFileSync('raw_error.txt', 'utf8').trim();
                if (errorOutput) commentBody += details('Execution error output', errorOutput);
              }

              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: prNumber,
                body: commentBody
              });

              console.log(`Successfully posted comment to PR #${prNumber}`);

            } catch (err) {
              console.error('🛑 Failed to post test results comment:', err);
              core.setFailed(`Comment step failed: ${err.message}`);
            }